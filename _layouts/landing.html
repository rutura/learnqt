<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include seohome.html %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }
        .hero {
            background: linear-gradient(135deg, #41cd52 0%, #217a2d 100%);
            color: white;
            padding: 4rem 0;
        }
        .section {
            padding: 4rem 0;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .cta-button {
            background-color: #41cd52;
            color: white;
            padding: 1rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            margin: 1rem 0;
        }
        .cta-button:hover {
            background-color: #217a2d;
            color: white;
            transform: translateY(-2px);
        }
        .testimonial-card {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            margin: 1rem 0;
        }
        .testimonial-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .check-list {
            list-style: none;
            padding-left: 0;
        }
        .check-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 0.5rem;
        }
        .check-list li:before {
            content: "✅";
            position: absolute;
            left: 0;
        }

        /* Responsive styles */
        .responsive-title {
            font-size: 2.5rem;
        }
        
        .responsive-lead {
            font-size: 1.1rem;
        }
        
        .responsive-cta {
            white-space: nowrap;
        }
        
        .responsive-hero-img {
            max-width: 100%;
            height: auto;
        }
        
        .responsive-book-title {
            font-size: 1.75rem;
        }
        
        .responsive-bundle-title {
            font-size: 1.5rem;
        }
        
        .responsive-bundle-btn {
            width: 100%;
            max-width: 300px;
        }

        .responsive-final-cta {
            width: 100%;
            max-width: 280px;
        }

        /* Media queries for better responsiveness */
        @media (min-width: 576px) {
            .responsive-title {
                font-size: 3rem;
            }
            .responsive-lead {
                font-size: 1.25rem;
            }
            .responsive-book-title {
                font-size: 2rem;
            }
            .responsive-bundle-title {
                font-size: 1.75rem;
            }
            .h4-md {
                font-size: calc(1.275rem + 0.3vw) !important;
            }
            .h5-md {
                font-size: calc(1.275rem + 0.3vw) !important;
            }
            .h3-md {
                font-size: calc(1.3rem + 1.5vw) !important;
            }
            .fs-5-md {
                font-size: 1.25rem !important;
            }
            .fs-6-md {
                font-size: 1rem !important;
            }
            .display-4-md {
                font-size: calc(1.475rem + 2.7vw) !important;
            }
        }

        @media (min-width: 768px) {
            .responsive-title {
                font-size: 3.5rem;
            }
            .responsive-lead {
                font-size: 1.35rem;
            }
            .responsive-hero-img {
                max-width: 700px;
            }
            .responsive-book-title {
                font-size: 2.25rem;
            }
            .responsive-bundle-title {
                font-size: 2rem;
            }
            .responsive-cta {
                white-space: normal;
            }
            .responsive-bundle-btn {
                width: auto;
            }
            .responsive-final-cta {
                width: auto;
            }
        }

        @media (max-width: 575px) {
            .badge {
                font-size: 0.8rem !important;
                padding: 0.5rem 0.75rem !important;
                line-height: 1.2;
                word-break: break-word;
                white-space: normal;
                text-align: center;
            }
            .responsive-cta {
                font-size: 0.9rem !important;
                padding: 0.75rem 1rem !important;
            }
            .container {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .px-4 {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
        }
    </style>
</head>
<body>
    {{ content }}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
