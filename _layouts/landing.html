<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include seohome.html %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
        }
        .hero {
            background: linear-gradient(135deg, #41cd52 0%, #217a2d 100%);
            color: white;
            padding: 4rem 0;
        }
        .section {
            padding: 4rem 0;
        }
        .card {
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .cta-button {
            background-color: #41cd52;
            color: white;
            padding: 1rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-block;
            margin: 1rem 0;
        }
        .cta-button:hover {
            background-color: #217a2d;
            color: white;
            transform: translateY(-2px);
        }
        .testimonial-card {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 10px;
            margin: 1rem 0;
        }
        .testimonial-image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .check-list {
            list-style: none;
            padding-left: 0;
        }
        .check-list li {
            position: relative;
            padding-left: 2rem;
            margin-bottom: 0.5rem;
        }
        .check-list li:before {
            content: "✅";
            position: absolute;
            left: 0;
        }
    </style>
</head>
<body>
    {{ content }}
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
