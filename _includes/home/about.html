<div class="container-fluid">

<div class="row mb-5">
<div class="col-md-10 mx-auto p-3 p-md-5 text-center mt-5">
<h2><strong><a href="{{page.url}}">{{page.why.title}}</a></strong></h2>
<div class="bot-center col-md-1 mt-3 col-2"></div>
<p class="mt-5 col-md-6 mx-auto">{{page.why.description}}</p>
</div>

<div class="col-md-9 mx-auto">
<div class="row">

{% for w in page.why.list %}
<div class="col-md-3 p-3">
<div class="p-3 p-md-3 shadow-sm rounded border-top border-success zoom">
<div class="text-center"><img class="img-fluid bg-light rounded-circle p-3 mt-3 lazyload" alt="{{page.title}}" loading="lazy" width="120" height="120" data-src="{{w.image}}"/></div>
<div class="p-3">
<p><a href="{{site.url}}">{{w.title}}</a></p>
<p><small>{{w.description}}</small></p>
</div>
</div>
</div>
{% endfor %}

</div>
</div>

</div>

<div class="col-md-10 mx-auto p-3">
<div class="row bg-light sers mt-5 mail shadow-sm">
  <div class="col-md-5 p-4 d-flex align-items-center">
    <h2 class="mb-0"><strong>{{page.notified.title}}</strong></h2>
  </div>
  <div class="col-md-7 p-4">
    <style>
    .formkit-form[data-uid="67a33fe28d"] {
      margin: 0 !important;
      display: flex !important;
      justify-content: flex-start !important;
      align-items: flex-start !important;
      width: 100% !important;
    }
    .formkit-form[data-uid="67a33fe28d"] > div {
      width: 100% !important;
      margin: 0 !important;
    }
    .formkit-form[data-uid="67a33fe28d"] .formkit-fields {
      display: flex !important;
      gap: 10px !important;
      flex-direction: column !important;
      align-items: stretch !important;
      width: 100% !important;
      margin: 0 !important;
    }
    .formkit-form[data-uid="67a33fe28d"] .formkit-field {
      width: 100% !important;
    }
    .formkit-form[data-uid="67a33fe28d"] .formkit-input {
      font-size: 16px !important;
      padding: 12px 15px !important;
      width: 100% !important;
      min-height: 40px !important;
    }
    .formkit-form[data-uid="67a33fe28d"] .formkit-submit {
      margin: 0 !important;
      width: 100% !important;
    }
    .formkit-form[data-uid="67a33fe28d"] .formkit-submit > span {
      width: 100% !important;
      min-height: 40px !important;
    }
    .formkit-form[data-uid="67a33fe28d"] + p {
      margin-top: 10px !important;
      width: 100% !important;
      text-align: center !important;
      font-size: 14px !important;
      opacity: 0.8 !important;
    }
    @media (max-width: 768px) {
      .formkit-form[data-uid="67a33fe28d"] {
        margin-top: 20px !important;
      }
    }
    </style>

    <script async data-uid="67a33fe28d" src="https://learnqtguide.kit.com/67a33fe28d/index.js"></script>

    <p class="mb-3 text-muted small">
      {{page.notified.description}}
    </p>
  </div>
</div>
</div>

<div class="row mb-5" id="about">
<div class="col-md-12 p-3 p-md-5 text-center mt-5">
<h2><strong><a href="{{site.url}}">{{site.author.title}}</a></strong></h2>
</div>
<div class="col-md-8 mx-auto">
<div class="row">
<div class="col-md-4 p-3 p-md-5 text-center">
<img class="img-fluid rounded-circle lazyload" loading="lazy" width="200" height="200" alt="{{site.author.name}}" data-src="{{site.author.image}}"/>
</div>
<div class="col-md-8 p-3">
<h3><strong>{{site.author.name}}</strong></h3>
<span class="badge bg-green">{{site.author.label}}</span>
<hr class="hr-green col-md-1 col-2"/>
<p>{{site.author.description}}</p>
</div>
</div>
</div>
</div>
</div>
