# blog post pagination
paginate: 5
# default blog post
paginate_path: "/blog/page:num/"


# settup

collections:
  courses:
    output: true
  books:
    output: true
  pages:
    output: true
defaults:
  - scope:
      path: ""
      type: "courses"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "books"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
#      permalink: /:year/:month/:title:output_ext
      permalink: /:title
  - scope:
      path: ""
    values:
      layout: "default"
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    default_lang: html
    css_class   : 'syntax'
