# Global FAQ section
faq:
  title: "Frequently Asked Questions"
  subtitle: "Everything you need to know before getting started"
  items:
    - q: "Do I need prior programming experience?"
      a: "No! Our courses are designed for complete beginners. We cover everything from language basics to advanced patterns. However, if you have programming experience, you'll be able to progress faster."
    - q: "What if I get stuck on something?"
      a: "You'll have access to our Discord community with 4,000+ developers plus direct help from Daniel. Most questions are answered within hours, and complex issues get detailed video responses."
    - q: "How long will it take to complete a course?"
      a: "Most students finish in 8-12 weeks studying 1-2 hours per day. However, you can go at your own pace with lifetime access - no pressure or deadlines."
    - q: "Will this help me get a job?"
      a: "Absolutely! Our courses focus on real-world projects that showcase skills employers want. Many students have landed developer roles, freelance contracts, and promotions after completing our courses."
    - q: "What if I'm not satisfied?"
      a: "We offer a 30-day money-back guarantee. If you're not completely satisfied with your progress, get a full refund - no questions asked."
    - q: "Do courses get updated?"
      a: "Yes! All courses receive lifetime updates as technologies evolve. When Qt releases new versions or we add new content, you get it automatically at no extra cost."
    - q: "Can I download the course materials?"
      a: "With the lifetime purchase, yes! You get downloadable videos, source code, PDFs, and resources. Monthly subscribers can access everything online."
    - q: "Are there prerequisites for specific courses?"
      a: "Each course lists its prerequisites in the description. Generally, C++ courses assume no prior C++ knowledge, and Python courses assume basic Python familiarity, but we provide refreshers."

