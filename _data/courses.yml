courses:
  - id: "qt-widgets-cpp"
    title: "Desktop Apps with Qt Widgets and C++"
    short_title: "Qt Widgets C++"
    description: "Master professional desktop application development using Qt Widgets and modern C++. Build cross-platform applications that run seamlessly on Windows, macOS, and Linux with native performance and polished user interfaces."
    image: "/assets/courses/image/qt6_gui_beginners.png"
    category: "Desktop Development"
    technology: "Qt Widgets"
    language: "C++"
    level: "Beginner to Intermediate"
    duration: "40+ hours"
    featured: true
    
    # Sales page content sections
    sections:
      hero:
        subtitle: "Master professional desktop application development using Qt Widgets and modern C++. Build cross-platform applications that run seamlessly on Windows, macOS, and Linux with native performance and polished user interfaces."
        showcase_image: "/assets/courses/image/qt6_gui_beginners.png"
        
      why_this_course:
        title: "Why This Course?"
        content: |
          This course takes you from absolute beginner to building complete, polished desktop applications—teaching you the foundations of Qt Widgets, modern C++, and production patterns along the way. Instead of struggling with outdated tutorials, you'll learn how to build professional, responsive, and production-ready applications that run seamlessly across Windows, macOS, and Linux.
        bullets:
          - "✅ Hands-On From Day One – Learn by building real applications, not reading dry theory"
          - "✅ Step-By-Step Progression – Each chapter builds naturally on the last, no big jumps"
          - "✅ Production-Ready Skills – From widgets to deployment, layouts to databases"
          - "✅ Complete Real Projects – Watch your apps evolve from basics to polished final products"
          - "✅ Up-to-Date With Qt 6 – Covers modern best practices for professional development"
        showcase_image: "/assets/courses/image/qt_gui_intermediate.png"
        
      creator_story:
        title: "Created by Someone Who Understands the Struggle"
        content: |
          "When I first learned Qt development, I had to scrape together tutorials, documentation, and forum posts. It was messy, overwhelming, and frustrating. I wished for a single resource that explained everything clearly."
          
          After 10+ years of professional Qt development and teaching thousands of students worldwide, Daniel Gakwaya has created the course he wished he had starting out:
        bullets:
          - "• A clear path from beginner to professional"
          - "• Hands-on projects that grow with your skills"
          - "• Guidance that cuts through scattered docs and tutorials"
        content_2: |
          This course is written for anyone who wants to master modern cross-platform desktop development with Qt. Beginners with no prior Qt or C++ experience will find a clear path into the framework. Web developers who want to deliver native desktop performance will discover a more efficient workflow. Mobile developers will learn how to create professional desktop applications. And students or researchers will gain practical experience that goes far beyond theoretical knowledge.
          
      what_you_get:
        title: "📦 What You'll Get"
        bullets:
          - "• 🎥 40+ Hours of Video Content – Comprehensive step-by-step tutorials"
          - "• 📄 Complete Source Code – For every project in the course"
          - "• 🔄 Lifetime Updates – All new content as it's released"
          - "• 💻 Downloadable Resources – PDFs, code templates, and project files"
          - "• 🌐 Exclusive Developer Community – Support, networking & direct feedback"
          - "• 📜 Certificate of Completion – Add to your professional portfolio"
        content: |
          By the time you finish, you'll not only understand Qt Widgets—you'll have built production-quality applications and developed the confidence to create your own projects from scratch. You'll know how to work with Qt's documentation, how to apply modern best practices, and how to structure your code so that it scales with your ambitions.
          
          You'll also get lifetime access to updates as Qt evolves, plus access to an active Discord community of over 4,000 Qt developers where you can get support, share projects, and connect with others working in the same space.
    
