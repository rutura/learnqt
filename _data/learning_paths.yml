# Learning Paths Configuration
learning_paths:
  - title: "Modern C++ 20 and C++ 23 with Pro Tools and Projects"
    icon: "🚀"
    image: "/assets/img/learning-paths/cpp-mastery.webp"
    description: "For those ready to master modern C++ from fundamentals to expert-level skills, empowering you to confidently build high-performance, industry-grade applications with the latest tools and standards."
    outcome: "You'll confidently write robust, clean, and efficient C++ code leveraging cutting-edge standards like C++20 and C++23, equipped with professional-grade tools and secure coding practices to elevate your development skills and career opportunities."
    path_id: "cpp-mastery"
    courses:
      - title: "C++23 Fundamentals with Projects & Algorithms"
        subtitle: "Gain solid foundations, practice with real-world algorithms, and develop a deep understanding of modern C++."
        url_key: "cpp23fundamentals"
      - title: "The C++20 Masterclass : From Fundamentals to Advanced"
        subtitle: "Elevate your skills, master modern features, and solve complex, practical programming challenges."
        url_key: "cpp20masterclass"

  - title: "Professional Cross-Platform Desktop Development with Qt Widgets and C++"
    icon: "🖥️"
    image: "/assets/img/learning-paths/qt-widgets-cpp.webp"
    description: "For developers who want to build professional, high-quality desktop applications that run seamlessly across Windows, macOS, and Linux, delivering a polished user experience while leveraging the power of Qt Widgets with modern C++ for true cross-platform development."
    outcome: " You will craft versatile, maintainable desktop software using Qt Widgets and modern C++, building polished, responsive apps that run seamlessly across Windows, macOS, and Linux."
    path_id: "qt-widgets-cpp"
    courses:
      - title: "Qt 6 C++ GUI Development for Beginners : The Fundamentals"
        subtitle: "Quickly master essential Qt widgets, signals, slots, and build interactive GUIs."
        tag: ""
        url_key: "qt6guibeginners"
      - title: "Qt C++ Widgets Intermediate: Build Feature-Rich UIs"
        subtitle: "Master events, custom widgets, painting, and drag-and-drop to create polished, professional desktop apps."
        tag: ""
        url_key: "qtwidgetsintermediatecpp"
      - title: "Qt6 Model-View Architecture in C++: Build Data Driven UIs"
        subtitle: "Learn advanced data-handling techniques to create scalable, maintainable, and professional-grade apps."
        url_key: "cppqt6mvc"

  - title: "Building Cross-Platform Desktop Apps with Qt Widgets in PySide6"
    icon: "🐍"
    image: "/assets/img/learning-paths/qt-widgets-python.webp"
    description: "For Python developers ready to harness the power of Qt with  Python to create polished, professional desktop applications for Windows, macOS, and Linux."
    outcome: "You will confidently design, build, and deploy cross-platform Python desktop applications with responsive, professional-grade user interfaces using PySide6 and Qt Widgets."
    path_id: "qt-widgets-python"
    courses:
      - title: "Qt For Python (PySide6) GUI For Beginners"
        subtitle: "Dive into GUI creation, widgets, layouts, signals, and slots, using Python's easy-to-read syntax."
        url_key: "pyside6widgetsbeginners"
      - title: "Qt6 Model-View Architecture in PySide6: Build Data Driven UIs"
        subtitle: "Master the Model-View architecture to build efficient, maintainable Python-based desktop applications."
        url_key: "pyside6mvc"

  - title: "Build Fluid, Dynamic UIs for Mobile & Embedded with Qt QML"
    icon: "📱"
    image: "/assets/img/learning-paths/qt-qml.webp"
    description: "For developers aiming to cook up modern, fluid and dynamic user interfaces for embedded systems and mobile apps using Qt Quick and QML."
    outcome: "You will design responsive and visually stunning UIs optimized for embedded and mobile applications, seamlessly integrating with C++ for high-performance, real-world deployments."
    path_id: "qt-qml"
    courses:
      - title: "Qt6 QML For Beginners: The Fundamentals"
        subtitle: "Learn how to quickly build intuitive, fluid, and visually appealing UIs using Qt Quick."
        tag: ""
        url_key: "qt6qmlbeginners"
      - title: "Qt6 QML Intermediate: Interfacing to C++"
        subtitle: "Deepen your skills by integrating QML with C++ for powerful, high-performance applications."
        tag: ""
        url_key: "qt6qmlintermediate"
      - title: "Qt6 QML Advanced: Interfacing to C++"
        subtitle: "Master advanced integration, performance optimization, and sophisticated UI development."
        tag: ""
        url_key: "qt6qmladvanced"
