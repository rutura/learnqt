title: "Multithreading and IPC with Qt C++ - Course Curriculum"
subtitle: "9 Chapters, 70+ Lessons — Master Threading, Concurrency, and Inter-Process Communication"
chapters:
  - title: "Chapter 1: Welcome"
    icon: "fas fa-door-open"
    description: "Get oriented with the course structure, download all resources and source code, and understand the context of threads, processes, and inter-process communication in Qt applications."
    outcome: "A clear understanding of the course scope and all resources ready for your learning journey"
    lessons:
      - name: "Welcome"
        duration: "5:06"
      - name: "Resources and Source Code"
        duration: ""
      - name: "Threads, Processes and IPC: Context"
        duration: "12:01"
  - title: "Chapter 2: Creating Threads"
    icon: "fas fa-layer-group"
    description: "Master all the ways to create and manage threads in Qt. From QThread-Create and MoveToThread patterns to ThreadPools with QRunnable — you'll understand when and how to use each threading approach, including working with custom types and asynchronous code."
    outcome: "Complete mastery of Qt threading creation patterns and the ability to choose the right approach for your application"
    lessons:
      - name: "Threading Overview"
        duration: "7:44"
      - name: "QThread-Create"
        duration: "27:09"
      - name: "MoveToThread"
        duration: "30:06"
      - name: "Subclass QThread"
        duration: "16:09"
      - name: "QThread with asynchronous code-QThread-Create"
        duration: "7:59"
      - name: "QThread with asynchronous code-MoveToThread"
        duration: "12:43"
      - name: "QThread with asynchronous code-Subclass QThread"
        duration: "10:06"
      - name: "ThreadPool and QRunnable"
        duration: "11:06"
      - name: "ThreadPool and QRunnable - Sending feedback to ui"
        duration: "24:28"
      - name: "ThreadPool and QRunnable - Async Code"
        duration: "4:52"
      - name: "Custom Type Signal Parameters"
        duration: "12:51"
      - name: "Threading Methods Comparison"
        duration: "4:32"
  - title: "Chapter 3: Thread Synchronization"
    icon: "fas fa-sync-alt"
    description: "Learn how to coordinate multiple threads safely using Qt's synchronization primitives. Master Mutexes, ReadWrite Locks, Semaphores, and Wait Conditions to prevent race conditions and deadlocks while building robust multi-threaded applications."
    outcome: "Safe, synchronized multi-threaded code using the right synchronization mechanism for each scenario"
    lessons:
      - name: "Thread Synchronization Overview"
        duration: "4:15"
      - name: "Thread Synchronization - Mutex"
        duration: "21:18"
      - name: "Thread Synchronization - Mutex - Shared variable"
        duration: "15:18"
      - name: "Thread Synchronization - ReadWrite Lock"
        duration: "17:02"
      - name: "Thread Synchronization - Semaphores"
        duration: "29:39"
      - name: "Thread Synchronization - WaitConditions"
        duration: "20:58"
      - name: "Wait Conditions - Pause Resume"
        duration: "18:44"
      - name: "Thread Synchronization - Chapter Review"
        duration: "2:04"
  - title: "Chapter 4: Thread Safety and Reentrancy"
    icon: "fas fa-shield-alt"
    description: "Understand thread safety in Qt and how to safely communicate across threads. Master cross-thread signals and slots, learn about thread-safe Qt classes, and discover the subtleties of using slots in QThread subclasses."
    outcome: "Confidence in writing thread-safe Qt code and understanding when Qt objects can be safely shared between threads"
    lessons:
      - name: "Thread Safety and Reentrancy Overview"
        duration: "16:14"
      - name: "Cross Thread Signals and Slots - Example1"
        duration: "21:58"
      - name: "Cross Thread Signals and Slots - Example2"
        duration: "13:43"
      - name: "Cross Thread Signals and Slots - Example3"
        duration: "6:31"
      - name: "Slots in QThread Subclass"
        duration: "9:43"
      - name: "Thread Safety and Reentrancy - Chapter Review"
        duration: "1:27"
  - title: "Chapter 5: Qt Concurrent"
    icon: "fas fa-bolt"
    description: "Simplify concurrent programming with Qt Concurrent's high-level APIs. Use map, filter, and reduce operations to process collections in parallel, manage asynchronous operations with QFuture, and monitor progress — all without managing threads directly."
    outcome: "Efficient parallel processing using Qt Concurrent's functional programming style"
    lessons:
      - name: "Qt Concurrent Overview"
        duration: "5:53"
      - name: "Qt Concurrent-run-synchronous"
        duration: "13:55"
      - name: "QtConcurrent run asynchronous, ReturnValues"
        duration: "22:31"
      - name: "Qt Concurrent map"
        duration: "13:05"
      - name: "Qt Concurrent-maped"
        duration: "15:20"
      - name: "Qt Concurrent-mapReduced"
        duration: "32:51"
      - name: "Qt Concurrent-Filter"
        duration: "17:11"
      - name: "Qt Concurrent-Filtered"
        duration: "8:47"
      - name: "Qt Concurrent-FilterReduce"
        duration: "10:26"
      - name: "Qt Concurrent-QFutureSynchronizer"
        duration: "6:54"
      - name: "Qt Concurrent-Feedback"
        duration: "3:49"
      - name: "Threading Overview-Comparison"
        duration: "6:02"
  - title: "Chapter 6: Processes"
    icon: "fas fa-cogs"
    description: "Learn how to launch, manage, and communicate with external processes from your Qt applications using QProcess. Control process lifecycle, handle input/output streams, and integrate external programs seamlessly."
    outcome: "Ability to manage external processes programmatically from Qt applications"
    lessons:
      - name: "Managing Processes from Qt"
        duration: "14:36"
  - title: "Chapter 7: Inter Process Communication"
    icon: "fas fa-exchange-alt"
    description: "Master the art of making separate processes communicate. Explore shared memory, TCP sockets, and file-based IPC mechanisms. Compare different approaches and learn when to use each method for reliable inter-process data exchange."
    outcome: "Multiple IPC strategies and the ability to choose the best approach for your architecture"
    lessons:
      - name: "IPC Overview"
        duration: "6:25"
      - name: "IPC - SharedMemory"
        duration: "24:28"
      - name: "IPC - TCP (QTcpSocket)"
        duration: "25:24"
      - name: "IPC - Files on FileSystem"
        duration: "14:24"
      - name: "IPC Overview-Comparison"
        duration: "3:03"
  - title: "Chapter 8: DBus"
    icon: "fas fa-network-wired"
    description: "Dive deep into D-Bus, the powerful IPC mechanism for desktop Linux applications. Build client-server architectures, exchange messages, emit/receive signals across processes, and use introspection to discover D-Bus interfaces dynamically."
    outcome: "Professional D-Bus integration for Linux desktop applications"
    lessons:
      - name: "DBus Overview"
        duration: "14:56"
      - name: "DBus-Client-Server: Server"
        duration: "25:44"
      - name: "DBus Client-Server: Client"
        duration: "14:00"
      - name: "DBus-SignalsSlots"
        duration: "25:06"
      - name: "QDBusMessage"
        duration: "25:59"
      - name: "QDBusInterface"
        duration: "20:23"
      - name: "Introspection"
        duration: "8:36"
      - name: "DBus-Overview"
        duration: "2:19"
  - title: "Chapter 9: Wrap up"
    icon: "fas fa-flag-checkered"
    description: "Review everything you've learned about multithreading, concurrency, processes, and inter-process communication in Qt. Consolidate your knowledge and understand how all these concepts work together in real-world applications."
    outcome: "Complete understanding of Qt's threading and IPC capabilities"
    lessons:
      - name: "Course Review"
        duration: "4:15"

