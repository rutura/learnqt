title: "Desktop Apps with Qt Widgets and C++ - Course Curriculum"
subtitle: "23 Chapters, 270+ Lessons — Master Every Building Block of Professional Desktop Development"
chapters:
  - title: "Chapter 1: Welcome"
    icon: "fas fa-door-open"
    description: "See the impressive applications you'll build by the end of this course. Get oriented with the course structure, download all resources and source code, and get excited about the journey ahead."
    outcome: "A clear roadmap of your learning journey and all resources downloaded"
    lessons:
      - name: "Welcome"
        duration: "5:31"
      - name: "Resources and Source Code"
        duration: ""
      - name: "What You'll Build"
        duration: "11:48"
  - title: "Chapter 2: Environment Setup"
    icon: "fas fa-laptop-code"
    description: "Set up your complete Qt development environment on Windows or Linux — step by step, no guesswork. You'll install Qt Creator, configure your compiler, and verify everything works with your first build."
    outcome: "A fully configured Qt 6 development environment ready for real projects"
    lessons:
      - name: "Environment setup - Windows"
        duration: "17:09"
      - name: "Environment setup - Linux Ubuntu"
        duration: "18:43"
  - title: "Chapter 3: Getting Started, C++ Crash Course"
    icon: "fas fa-code"
    description: "Master the C++ fundamentals you need for Qt development. From data types and control flow to classes and the build process — you'll write real code from day one and build your first GUI application with a hands-on Guess My Number game."
    outcome: "Solid C++ foundations and your first working Qt GUI application"
