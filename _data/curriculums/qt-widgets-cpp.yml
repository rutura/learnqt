  - title: "Chapter 4: Memory Management"
    icon: "fas fa-microchip"
    description: "Understand how memory works in C++ and Qt. Learn the difference between heap and stack, use smart pointers to prevent memory leaks, and master Qt's parent-child ownership model that makes memory management almost automatic."
    outcome: "Leak-free code using smart pointers and Qt's parent-child memory model"
