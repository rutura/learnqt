title: "Qt QML Cross-Platform Deployment - Course Curriculum"
subtitle: "9 Chapters, 68 Lectures: Ship Your Qt QML App to Every Platform"
chapters:
  - title: "Chapter 1: Welcome & Orientation"
    status: done
    icon: "fas fa-door-open"
    description: "Get oriented with the course structure, meet the Squared app you'll ship to every platform, and learn how to follow along effectively."
    outcome: "A clear roadmap of your deployment learning journey and all resources ready to go"
    lessons:
      - name: "Welcome to the Course"
        duration: "7:20"
      - name: "What You'll Build"
        duration: "3:55"
      - name: "How to Get the Most Out of This Course"
        duration: "2:42"

  - title: "Chapter 2: Play with the Environment"
    status: done
    icon: "fas fa-laptop-code"
    description: "Get a working Qt dev environment on your OS with the Squared app building and running. Covers Windows, Linux, and macOS setup so you're ready to deploy from any host."
    outcome: "Squared app building and running on your machine, ready for deployment work"
    lessons:
      - name: "Play with the Environment: Windows"
        duration: "39:10"
      - name: "Play with the Environment: Linux"
        duration: "26:21"
      - name: "Play with the Environment: macOS"
        duration: "29:07"

  - title: "Chapter 3: Windows Deployment"
    status: done
    icon: "fab fa-windows"
    description: "Package Squared for Windows. You'll fix the missing DLL launch failure with windeployqt, build a proper cmake --install tree, and produce an NSIS installer with Start Menu and Desktop shortcuts plus a portable ZIP for zero-install users."
    outcome: "A polished NSIS installer and a portable ZIP ready for Windows users"
    lessons:
      - name: "Configure and Build the App"
        duration: "10:14"
      - name: "What Happens When You Copy the Binary"
        duration: "16:49"
      - name: "windeployqt"
        duration: "8:33"
      - name: "cmake --install and the Deploy Script"
        duration: "12:15"
      - name: "Packaging with CPack: NSIS Installer"
        duration: "13:28"
      - name: "Packaging with CPack: ZIP"
        duration: "4:29"

  - title: "Chapter 4: Linux Deployment"
    status: done
    icon: "fab fa-linux"
    description: "Package Squared for any modern Linux distribution. Strip RUNPATH, wire up qt.conf, run linuxdeploy inside Docker for reproducible builds, and produce three distributable formats: a portable AppImage, a Debian .deb, and a plain tar.gz bundle. FreeDesktop .desktop files and hicolor icon theme included."
    outcome: "An AppImage, a .deb, and a tar.gz bundle, plus a Docker-based build you can run in CI"
    lessons:
      - name: "Configure and Build"
        duration: "15:26"
      - name: "Strip RUNPATH and Manual Copy"
        duration: "26:39"
      - name: "qt.conf"
        duration: "6:00"
      - name: "linuxdeploy"
        duration: "16:42"
      - name: "cmake --install"
        duration: "11:07"
      - name: "FreeDesktop: .desktop File and Icons"
        duration: "7:35"
      - name: "AppImage with linuxdeploy"
        duration: "14:19"
      - name: "AppImage in Docker and CI"
        duration: "6:58"
      - name: "DEB with CPack"
        duration: "16:19"
      - name: "tar.gz Portable Bundle"
        duration: "4:57"

  - title: "Chapter 5: macOS Deployment"
    status: done
    icon: "fab fa-apple"
    description: "Produce a macOS app bundle that launches on any Mac without Gatekeeper warnings. Run macdeployqt, fix @rpath and @executable_path library paths, sign with a Developer ID certificate, notarize through Apple, staple the ticket, and package into a branded DMG."
    outcome: "A signed, notarized, distributable DMG plus a tar.gz portable bundle"
    lessons:
      - name: "Configure, Build, and Run"
        duration: "18:51"
      - name: "Strip RPATH and Copy the Binary"
        duration: "40:26"
      - name: "qt.conf"
        duration: "6:16"
      - name: "macdeployqt"
        duration: "16:37"
      - name: "cmake --install and the Deploy Script"
        duration: "20:30"
      - name: "DMG with hdiutil"
        duration: "8:27"
      - name: "CPack DragNDrop"
        duration: "10:35"
      - name: "CPack tar.gz Portable Bundle"
        duration: "5:52"
      - name: "Code Signing"
        duration: "17:07"
      - name: "Notarization"
        duration: "9:11"

  - title: "Chapter 6: Android Deployment"
    status: done
    icon: "fab fa-android"
    description: "Cross-compile Squared for Android, configure the manifest and launcher icons, build with qt-cmake, understand the android-build directory and APK internals, sign with a keystore, and produce both an APK and an AAB ready for Play Store upload."
    outcome: "A signed APK and an Android App Bundle (AAB) live on the Play Store"
    lessons:
      - name: "Desktop vs Android Architecture"
        duration: "15:40"
      - name: "Prerequisites"
        duration: "34:14"
      - name: "Android Manifest and Launcher Icons"
        duration: "15:51"
      - name: "CMake Configuration for Android"
        duration: "21:07"
      - name: "Cross-Compilation with qt-cmake"
        duration: "9:45"
      - name: "The android-build Directory"
        duration: "10:53"
      - name: "APK Internals and AAB"
        duration: "6:52"
      - name: "Signing"
        duration: "18:46"
      - name: "Deploy and Debug"
        duration: "18:27"
      - name: "Android Emulator"
        duration: "10:22"
      - name: "Google Play"
        duration: "16:09"

  - title: "Chapter 7: iOS Deployment"
    status: done
    icon: "fas fa-mobile-alt"
    description: "Build Squared for iOS with static Qt linking, produce a simulator build and a device build, handle the asset catalog, sign with a provisioning profile, and create a distributable IPA published through App Store Connect."
    outcome: "A simulator build, a device build, a signed IPA, and a listing published through App Store Connect"
    lessons:
      - name: "Static vs Dynamic Linking"
        duration: "10:18"
      - name: "Prerequisites"
        duration: "12:51"
      - name: "Asset Catalog"
        duration: "8:58"
      - name: "CMake Configuration for iOS"
        duration: "13:13"
      - name: "Simulator Build"
        duration: "15:41"
      - name: "The iOS App Bundle"
        duration: "7:55"
      - name: "Device Build and Code Signing"
        duration: "7:20"
      - name: "IPA Creation and Distribution Paths"
        duration: "8:30"
      - name: "App Store Connect: Publishing"
        duration: "5:44"

  - title: "Chapter 8: Embedded Linux ARM (Raspberry Pi)"
    status: done
    icon: "fas fa-microchip"
    description: "Cross-compile Qt and Squared for Raspberry Pi using Docker. Generate a sysroot, write a CMake toolchain file, build Qt from source inside a container, deploy to the Pi, and update the application in place."
    outcome: "A cross-compiled Qt + Squared build deployed, launched, and updatable on a Raspberry Pi"
    lessons:
      - name: "What We are Building"
        duration: "19:47"
      - name: "Cross Compilation Concepts"
        duration: "8:37"
      - name: "Docker Primer"
        duration: "12:42"
      - name: "The Sysroot"
        duration: "12:36"
      - name: "The Toolchain File"
        duration: "12:46"
      - name: "The Main Dockerfile"
        duration: "15:41"
      - name: "The Build Script"
        duration: "21:21"
      - name: "Where and How The App Runs"
        duration: "3:04"
      - name: "Deploying and Launching on the Pi"
        duration: "18:55"
      - name: "Updating the Application"
        duration: "3:09"

  - title: "Chapter 9: CI/CD with GitHub Actions"
    status: done
    icon: "fab fa-github"
    description: "Turn all your manual deployment steps into a GitHub Actions workflow that produces Linux (Docker-built packaging), macOS, and Windows artifacts from a single job pipeline, then trigger a real release."
    outcome: "A GitHub Actions workflow that builds and releases desktop artifacts automatically"
    lessons:
      - name: "Workflow Structure"
        duration: "15:24"
      - name: "Linux Job in Docker"
        duration: "10:31"
      - name: "Linux Packaging in CI"
        duration: "2:01"
      - name: "macOS-Windows Job"
        duration: "15:32"
      - name: "Release Assets"
        duration: "6:39"
      - name: "Triggering a Release"
        duration: "16:31"
