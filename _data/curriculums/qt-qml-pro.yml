      - name: "QML Module Utilities"
        duration: "13:17"
      - name: "Summary"
        duration: "2:13"
  - title: "Chapter 8: Positioning"
    icon: "fas fa-th"
    description: "Master QML layout systems. Use anchors for relative positioning, work with margins and offsets, position items with positioners, create responsive layouts with Layout managers, and control flow arrangements."
    outcome: "Professional responsive layouts using anchors, positioners, and Layout managers"
    lessons:
