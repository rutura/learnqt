title: "Qt QML From Beginner to Pro - Course Curriculum"
subtitle: "25 Chapters, 240+ Lessons — Master Modern UI Development with Qt Quick and QML"
chapters:
  - title: "Chapter 1: Introduction"
    icon: "fas fa-door-open"
    description: "Welcome to Qt QML development! Get oriented with the course structure, download all resources and source code, and set up your development environment on Windows or Linux. Learn to run QML applications and understand project structure from day one."
    outcome: "A fully configured Qt development environment and understanding of QML project structure"
    lessons:
      - name: "Welcome"
        duration: "16:35"
      - name: "Resources and source code"
        duration: ""
      - name: "Windows Installation"
        duration: "8:49"
      - name: "Linux Installation"
        duration: "15:17"
      - name: "Running QML"
        duration: "11:07"
      - name: "Project Structure"
        duration: "8:57"
  - title: "Chapter 2: QML Syntax"
    icon: "fas fa-code"
    description: "Master the fundamentals of QML declarative syntax. Learn about data types, property binding, the Qt global object, and property handlers — the building blocks of every QML application you'll create."
    outcome: "Solid understanding of QML syntax, data types, and property binding mechanisms"
    lessons:
      - name: "Introduction"
        duration: "1:15"
      - name: "Syntax Overview"
        duration: "26:32"
      - name: "Exploring Data Types"
        duration: "22:26"
      - name: "Property Binding"
        duration: "13:04"
      - name: "The Qt Global Object"
        duration: "13:51"
      - name: "Property Handlers"
        duration: "6:24"
      - name: "Summary"
        duration: "2:19"
  - title: "Chapter 3: Basic Elements"
    icon: "fas fa-shapes"
    description: "Get hands-on with QML's essential visual elements. Work with Rectangle, Item, Text, and Image components, and learn how to efficiently manage resources using qt_add_resource for production-ready applications."
    outcome: "Ability to build basic UIs using fundamental QML elements and resource management"
    lessons:
      - name: "Introduction"
        duration: "1:27"
      - name: "Rectangle, Item and Text"
        duration: "16:48"
      - name: "Image"
        duration: "15:51"
      - name: "Qt_add_resource"
        duration: "8:37"
      - name: "Summary"
        duration: "1:48"
  - title: "Chapter 4: Custom Components and Modules"
    icon: "fas fa-puzzle-piece"
    description: "Build reusable QML components and organize them into modules. Learn both modern QML module systems and legacy approaches to create maintainable, modular application architectures."
    outcome: "Custom reusable components organized into proper QML modules"
    lessons:
      - name: "Introduction"
        duration: "2:33"
      - name: "Custom Components"
        duration: "17:24"
      - name: "Custom Components in Place"
        duration: "15:31"
      - name: "QML Modules"
        duration: "18:19"
      - name: "QML Modules (legacy)"
        duration: "10:25"
      - name: "Summary"
        duration: "3:05"
  - title: "Chapter 5: Signals and Slots"
    icon: "fas fa-bolt"
    description: "Master QML's powerful communication mechanism. Handle signals, connect to methods, pass parameters, and build reactive interfaces where components communicate seamlessly across your application."
    outcome: "Interactive applications with cross-component communication using signals and slots"
    lessons:
