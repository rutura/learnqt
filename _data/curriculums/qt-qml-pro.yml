  - title: "Chapter 13: Networking"
    icon: "fas fa-globe"
    description: "Connect your QML applications to the internet. Make HTTP requests using XmlHttpRequest and build a complete REST API client to communicate with web services directly from QML."
    outcome: "QML applications that communicate with REST APIs and web services"
