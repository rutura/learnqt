  - title: "Chapter 19: Custom Models"
    icon: "fas fa-list-alt"
    description: "Master custom model creation for QML views. Build StringList models, object list models, editable models, work with QProperty, understand Abstract List Model concepts, decouple data from source, and handle model list properties."
    outcome: "Custom C++ models for complex data display in QML views"
