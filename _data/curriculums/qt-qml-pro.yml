  - title: "Chapter 22: Singletons"
    icon: "fas fa-gem"
    description: "Master singleton patterns for QML. Work with QJsValue for JavaScript-based singletons and QObject-based singletons to create globally accessible objects with shared state across your application."
    outcome: "Singleton objects for shared state and global access in QML applications"
    lessons:
