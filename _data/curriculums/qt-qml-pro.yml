        duration: "1:17"
  - title: "Chapter 15: Interfacing C++ to QML"
    icon: "fas fa-link"
    description: "Bridge the gap between C++ and QML. Master context properties, connections, signals from C++, QPROPERTY mapping, context objects, JavaScript calls from C++, instantiable objects and modules, and singleton objects."
    outcome: "Seamless integration between C++ business logic and QML user interfaces"
    lessons:
