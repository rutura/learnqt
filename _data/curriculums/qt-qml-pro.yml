  - title: "Chapter 10: Dialogs"
    icon: "fas fa-window-restore"
    description: "Build professional dialog windows for QML applications. Master ColorDialog, FileDialog, FolderDialog, FontDialog, MessageDialog, and create custom dialogs with proper layouts and user interactions."
    outcome: "Professional dialog systems for file operations, settings, and user input in QML"
    lessons:
      - name: "Introduction"
        duration: "0:39"
      - name: "ColorDialog"
