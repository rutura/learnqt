  - title: "Chapter 21: Custom Visual Types"
    icon: "fas fa-paint-brush"
    description: "Create completely custom visual components in C++. Learn to paint QML items, build a custom bar chart with list properties, and create visual components using the Canvas element for ultimate flexibility."
    outcome: "Custom painted visual components including a complete bar chart control"
