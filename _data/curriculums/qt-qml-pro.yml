        duration: "1:41"
  - title: "Chapter 17: REST Integration"
    icon: "fas fa-server"
    description: "Build a production-ready REST client for QML applications. Create a REST client from scratch, implement a REST factory pattern, and fetch posts from real APIs using modern C++ integration techniques."
    outcome: "A complete REST client architecture for consuming web APIs from QML"
    lessons:
