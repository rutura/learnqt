      - name: "Signals across Components"
        duration: "21:03"
      - name: "Multiple Signal Parameters"
        duration: "5:49"
      - name: "Summary"
        duration: "3:41"
  - title: "Chapter 6: User Input"
    icon: "fas fa-keyboard"
    description: "Capture and handle user input with QML. Master text input fields, text editing, mouse interactions, keyboard handling, focus management with FocusScope, and key navigation for accessible interfaces."
    outcome: "Complete user input handling including text, mouse, and keyboard interactions"
    lessons:
