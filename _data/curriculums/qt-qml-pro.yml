    icon: "fas fa-th-large"
    description: "Get hands-on with Qt Quick Controls — the modern toolkit for QML interfaces. Master 20+ controls including Button, ComboBox, Slider, TabBar, Drawer, and ApplicationWindow to build polished, professional applications."
    outcome: "Ability to build any standard UI using Qt Quick Controls complete toolkit"
