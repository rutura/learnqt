  - title: "Chapter 11: Model View Architecture"
    icon: "fas fa-database"
    description: "Master QML's powerful Model-View architecture. Work with ListView, GridView, PathView, and TableView. Build inline and dynamic models, use Repeater, integrate XML data, and add headers, sections, and highlights."
    outcome: "Dynamic data-driven UIs with ListView, GridView, PathView, and TableView"
