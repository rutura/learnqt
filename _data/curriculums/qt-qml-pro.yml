      - name: "Summary"
        duration: "0:33"
  - title: "Chapter 14: Storage"
    icon: "fas fa-save"
    description: "Persist data in your QML applications. Use Qt Settings for automatic and custom preferences, save application states, and integrate SQLite databases for robust local data storage."
    outcome: "Applications that persist user data, preferences, and support SQLite databases"
    lessons:
      - name: "Introduction"
        duration: "1:07"
      - name: "Settings (Automatic)"
