      - name: "Key Navigation"
        duration: "6:51"
      - name: "FocusScope"
        duration: "11:36"
      - name: "Summary"
        duration: "1:28"
  - title: "Chapter 7: JavaScript"
    icon: "fas fa-js"
    description: "Integrate JavaScript into your QML applications. Learn functions, scope, direct and indirect imports, Qt.include, JavaScript modules, and QML module utilities to add powerful logic to your declarative UIs."
    outcome: "Ability to enhance QML applications with JavaScript logic and modular code"
    lessons:
      - name: "Introduction"
        duration: "0:36"
      - name: "JavaScript Usage"
        duration: "8:42"
      - name: "Functions and Scope"
