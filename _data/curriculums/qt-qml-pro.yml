  - title: "Chapter 23: Digging QML"
    icon: "fas fa-microscope"
    description: "Deep dive into QML's internal architecture. Use QQmlEngine to load QML, parse custom QML types, work with visual types through QQuickView, master QQmlApplicationEngine, invoke QML methods, and catch QML signals from C++."
    outcome: "Deep understanding of QML engine internals and advanced C++ control"
    lessons:
