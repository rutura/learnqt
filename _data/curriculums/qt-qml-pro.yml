  - title: "Chapter 12: Transforms, Transitions and Animations"
    icon: "fas fa-magic"
    description: "Bring your QML interfaces to life. Master transforms, animation targets, Behavior, SmoothedAnimation, SpringAnimation, ColorAnimation, easing curves, grouped animations, states, and transitions. Build real animations like a pendulum swing."
    outcome: "Stunning animated UIs with transforms, states, transitions, and smooth animations"
